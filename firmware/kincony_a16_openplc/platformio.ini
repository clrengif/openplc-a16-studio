; ============================================================================
; PlatformIO Project Configuration File — KinCony KC868-A16 OpenPLC Firmware
; ============================================================================
; Compilar: pio run
; Flashear por USB-C (CH340): pio run --target upload
; Monitor Serial (115200): pio device monitor
; ============================================================================

[env:kincony_kc868_a16]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D KC868_A16_BOARD=1
