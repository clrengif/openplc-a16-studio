; ============================================================================
; PCLino / OpenPLC Multi-Core Industrial Runtime — KinCony KC868-A16 (ESP32)
; Arquitectura Dual-Core FreeRTOS:
;   - Core 1: Determinismo de Control IEC 61131-3 (plc_scan_task @ 10..50 ms)
;   - Core 0: Buses de Campo Concurrentes (Modbus TCP, PROFINET RT, PROFIBUS DP,
;             CAN/DeviceNet TWAI y Servidor WebSocket de Telemetría)
; ============================================================================

[env:esp32dev]
platform = espressif32 @ ^6.7.0
board = esp32dev
framework = arduino

; Velocidad del monitor serial y flasheo por USB-C (CH340C)
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time

; Frecuencia de CPU a 240 MHz para garantizar scan determinista en Core 1
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Dependencias del ecosistema industrial y telemetría WebSocket
lib_deps =
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.0.4

; Flags de compilación:
; - CONFIG_FREERTOS_HZ=1000 (Tick de 1 ms exacto para vTaskDelayUntil)
; - Pines de I2C, Ethernet RMII LAN8720, UART2 RS-485 y CAN TWAI parametrizables
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_FREERTOS_HZ=1000
    -DPLC_DEFAULT_SCAN_MS=20
    -DI2C_SDA_PIN=4
    -DI2C_SCL_PIN=15
    -DPCF_IN1_ADDR=0x22
    -DPCF_IN2_ADDR=0x21
    -DPCF_OUT1_ADDR=0x24
    -DPCF_OUT2_ADDR=0x25
    -DRS485_TX_PIN=13
    -DRS485_RX_PIN=16
    -DRS485_DE_PIN=32
    -DCAN_TX_PIN=33
    -DCAN_RX_PIN=14
